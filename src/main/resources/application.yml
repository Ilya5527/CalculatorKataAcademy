app:
  datasource:
    postgres:
      hikari:
        pool-name: postgres-pool
        jdbc-url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
        username: ${POSTGRES_USERNAME:postgres}
        password: ${POSTGRES_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver
        maximum-pool-size: ${POSTGRES_MAX_POOL_SIZE:10}
        minimum-idle: ${POSTGRES_MIN_IDLE:2}
        idle-timeout: 60000
        connection-timeout: 30000
        max-lifetime: 1800000
        validation-timeout: 5000
    oracle:
      hikari:
        pool-name: oracle-pool
        jdbc-url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@localhost:1521/xe}
        username: ${ORACLE_USERNAME:system}
        password: ${ORACLE_PASSWORD:oracle}
        driver-class-name: oracle.jdbc.OracleDriver
        maximum-pool-size: ${ORACLE_MAX_POOL_SIZE:10}
        minimum-idle: ${ORACLE_MIN_IDLE:2}
        idle-timeout: 60000
        connection-timeout: 30000
        max-lifetime: 1800000
        validation-timeout: 5000
logging:
  level:
    com.zaxxer.hikari: INFO
    org.springframework.jdbc.core: INFO